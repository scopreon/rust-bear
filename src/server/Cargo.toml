[package]
name = "rust-bear"
version = "0.2.0"
authors = ["Saul Cooperman <saulcoops@gmail.com>"]
edition = "2021"
build = "build.rs"
description = "Bear rust impl for learning"
autobins = false
license = "MIT"
repository = "https://github.com/scopreon/rust-bear"
readme = "README.md"
categories = ["command-line-utilities"]

[dependencies]
prost = "0.14.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust-bear-proto = { path = "../schemas" }
tempfile = "3.27.0"
# protobuf-src = "2.1.1"

[[bin]]
name = "rust-bear"
path = "server.rs"
